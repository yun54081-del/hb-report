name: 每日更新實價登錄
on:
  schedule:
    - cron: '0 4 * * *'   # 台北時間每天中午 12:00
  workflow_dispatch:
    inputs:
      only:
        description: '只測一個社區（key，留空=全部）'
        required: false
        default: ''
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝工具與中文字型
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
          npm install --no-save playwright@1.48
          npx playwright install --with-deps chromium
          pip install pypdf
      - name: 測試內政部
        if: ${{ github.event.inputs.only == 'moi' }}
        run: |
          curl -sS -m 60 -o /tmp/a.zip -w '%{http_code} %{size_download}\n' 'https://plvr.land.moi.gov.tw/Download?type=zip&fileName=lvr_landcsv.zip' || true
          curl -sS -m 90 -o /tmp/b.zip -w '%{http_code} %{size_download}\n' 'https://plvr.land.moi.gov.tw/DownloadSeason?season=115S3&type=zip&fileName=lvr_landcsv.zip' || true
          unzip -l /tmp/a.zip | grep -i '^.*d_lvr_land_a' ; unzip -p /tmp/a.zip d_lvr_land_a.csv | head -5 ; unzip -p /tmp/a.zip d_lvr_land_a.csv | grep -c 東橋 ; unzip -p /tmp/a.zip d_lvr_land_a.csv | grep 東橋 | head -3
          unzip -p /tmp/b.zip d_lvr_land_a.csv | grep -c 東橋 || true
          exit 1
      - name: 抓取 5168 實價登錄
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          node tool/scrape.js "$(python3 tool/update.py period)"
          if [ -n "$ONLY" ]; then cat tool/raw.json | head -c 3000; exit 1; fi
      - name: 產生報表與網頁
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          python3 tool/update.py build
          cat tool/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 推送
        run: |
          git config user.name "hb-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "實價登錄更新 $(TZ=Asia/Taipei date +%F)"
          git push
