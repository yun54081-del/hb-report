name: 每日更新實價登錄
on:
  schedule:
    - cron: '0 4 * * *'   # 台北時間每天中午 12:00
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝工具與中文字型
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
          npm install --no-save playwright@1.48
          npx playwright install --with-deps chromium
          pip install pypdf
      - name: 抓取 5168 實價登錄
        run: node tool/scrape.js "$(python3 tool/update.py period)"
      - name: 產生報表與網頁
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          python3 tool/update.py build
          cat tool/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 推送
        run: |
          git config user.name "hb-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "實價登錄更新 $(TZ=Asia/Taipei date +%F)"
          git push
